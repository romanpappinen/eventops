# eventops :: Codex CLI project config
#
# CONFIRMED (2026-07, tested inside the actual devcontainer):
#   `bwrap --dev-bind / / true` fails with "No permissions to create new
#   namespace" — the host does not grant unprivileged user namespaces to
#   this nested container. This means Codex's internal OS-level sandbox
#   (bubblewrap) CANNOT be enforced here, no matter what sandbox_mode says.
#
#   Consequence: sandbox_mode = "workspace-write" would not actually
#   restrict anything — it would just fail to apply silently, or error out
#   on every command. Per OpenAI's own guidance for this exact scenario
#   (nested container, no working bwrap), the correct setup is:
#     sandbox_mode = "danger-full-access"   (accept there's no OS sandbox)
#     approval_policy = "untrusted"         (ask before EVERY command,
#                                             no exceptions — this is what
#                                             actually replaces the sandbox)
#
#   DO NOT change approval_policy to "on-request" or "never" while
#   sandbox_mode stays "danger-full-access". With no sandbox boundary to
#   cross, "on-request" has nothing to trigger on and behaves close to
#   fully autonomous — the opposite of what we want.
#
#   The real security boundary in this setup is layered outside Codex:
#     - container runs as non-root user "node" (see Dockerfile)
#     - capabilities dropped except CHOWN/FOWNER (see devcontainer.json)
#     - AGENTS.md secrets/deploy rules
#     - this file's approval_policy = "untrusted", which puts a human in
#       the loop before literally every action Codex takes.

approval_policy = "untrusted"      # ask before every command, no exceptions
approvals_reviewer = "user"        # you personally approve, not auto_review
sandbox_mode = "danger-full-access"
allow_login_shell = false
web_search = "disabled"
cli_auth_credentials_store = "file"

# NOTE: [sandbox_workspace_write] (network_access, blocked_paths) has no
# effect under sandbox_mode = "danger-full-access". Left here, inert, only
# as documentation of intent — if bwrap ever starts working on a different
# host (e.g. you move off nested devcontainers), switching sandbox_mode
# back to "workspace-write" will make this section active again as-is.
[sandbox_workspace_write]
network_access = false
exclude_tmpdir_env_var = false
exclude_slash_tmp = false
blocked_paths = [
  ".env",
  ".env.local",
  ".env.*",
  ".npmrc",
  "supabase/.temp",
  "supabase/.branches"
]

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
include_only = [
  "PATH",
  "HOME",
  "USER",
  "SHELL",
  "TERM",
  "TMPDIR",
  "TEMP",
  "TMP",
  "CI",
  "FORCE_COLOR",
  "NODE_ENV"
]
exclude = [
  "AWS_*",
  "AZURE_*",
  "GCP_*",
  "GOOGLE_*",
  "OPENAI_*",
  "SUPABASE_*",
  "DATABASE_URL",
  "REDIS_URL",
  "POSTGRES_*",
  "PG*",
  "STRIPE_*",
  "GITHUB_TOKEN",
  "NPM_TOKEN",
  "SSH_*"
]
set = { NODE_ENV = "development" }

# ---------------------------------------------------------------------------
# Profiles: explicit-only, never active by default.
# ---------------------------------------------------------------------------

[profiles.readonly]
# For exploration / review sessions where you want zero write risk,
# regardless of the base profile above. bwrap still won't enforce this
# technically, but combined with "untrusted" you'll see and can decline
# any write attempt before it happens.
approval_policy = "untrusted"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"

# Deliberately no [profiles.deploy] and no approval_policy = "never"
# anywhere in this file. Deploy is handled outside Codex entirely — see
# docs/REMOTE-ACCESS.md.
